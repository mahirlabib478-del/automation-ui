name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle
        run: gradle --version

      - name: Run Python ADB gesture recorder tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Package installable APK and ADB gesture helper
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp tools/adb_gesture_recorder.py dist/adb_gesture_recorder.py
          cp tools/adb_gesture_replayer.py dist/adb_gesture_replayer.py
          cat > dist/QUICKSTART.txt <<'EOF'
          ADB-ONLY RECORD & REPLAY QUICKSTART

          1. Extract this ZIP on the Windows computer. app-debug.apk is optional; ADB-only recording/replay does not require Automation UI to be installed or open.
          2. Enable Developer options and USB debugging on the Android phone. Connect USB and accept the RSA authorization prompt.
          3. Open Command Prompt in this extracted folder and run: adb devices
             If that command is not recognized, run C:\\platform-tools\\adb.exe devices. The scripts also check C:\\platform-tools\\adb.exe automatically.
          4. Keep Automation UI closed. Record directly from the phone's touchscreen with:
             python adb_gesture_recorder.py --output adb-gestures.json --capture-ui-hierarchy
          5. Use the phone normally. Each gesture records its start/end, duration, precise gap before the next gesture, and best-effort pre-touch foreground/window/UI text state. UI hierarchy capture may be slower or unavailable on some devices.
          6. Press Ctrl+C in the computer terminal to stop ADB capture.
          7. Preview the workflow without touching the phone:
             python adb_gesture_replayer.py --input adb-gestures.json --dry-run
          8. To replay using ADB only (screen-state verification is OFF by default):
             python adb_gesture_replayer.py --input adb-gestures.json
          9. Optional: enable best-effort screen-state checks with:
             python adb_gesture_replayer.py --input adb-gestures.json --verify-state
          10. Review adb-replay-log.jsonl for replayed coordinates and any warnings.

          NOTES
          - Keep the same display orientation during recording and replay.
          - If getevent access is denied, this ADB-only recorder cannot capture raw touch input on that OEM build. Use the optional hybrid Accessibility workflow instead; do not treat an empty JSON file as a successful capture.
          - Password fields are excluded from text recording. Multi-touch is intentionally not approximated.
          - This is a debug build. Automated tests passed, but each target app/workflow still requires real-device verification.
          - ADB shell input supports common taps/swipes/long-presses, not every protected system gesture, secure screen, or multi-touch interaction.
          - State verification is OFF by default to avoid false stops; the replayer will not stop if the phone is on the wrong screen. Use --verify-state when safety matters more than uninterrupted replay.
          - ADB shell input replays swipes as straight lines, not the sampled curved path. Curved swipes can behave differently; the replayer warns when the recorded path deviates from a straight line.
          - Review JSON and dry-run output before replay. Do not record passwords, payment screens, or private information.
          EOF
          test -s dist/app-debug.apk
          test -s dist/adb_gesture_recorder.py
          test -s dist/adb_gesture_replayer.py
          test -s dist/QUICKSTART.txt

      - name: Upload APK and ADB gesture helpers
        uses: actions/upload-artifact@v4
        with:
          name: automation-ui-hybrid-gesture-kit
          path: dist/
          if-no-files-found: error
          retention-days: 14
