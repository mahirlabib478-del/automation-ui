name: Windows Desktop Build

on:
  push:
    branches:
      - desktop-mvp
  workflow_dispatch:

concurrency:
  group: windows-desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows desktop package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build GUI and helper executables
        shell: cmd
        run: desktop\build_windows.bat
      - name: Smoke test packaged ADB helpers
        shell: cmd
        run: |
          dist\adb-flow-studio-recorder.exe --help
          if errorlevel 1 exit /b 1
          dist\adb-flow-studio-replayer.exe --help
          if errorlevel 1 exit /b 1
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: adb-flow-studio-windows-mvp
          path: dist\*.exe
          if-no-files-found: error
          retention-days: 14
