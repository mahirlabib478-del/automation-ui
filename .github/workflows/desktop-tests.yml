name: Desktop Python Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-tests:
    name: Desktop core and GUI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Compile desktop and helper scripts
        run: python -m compileall -q desktop tools
      - name: Run desktop core and GUI tests
        run: python -m unittest discover -s desktop/tests -v
